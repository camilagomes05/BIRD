services:
  r1:
    image: router-bird
    container_name: r1
    hostname: r1
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
    volumes:
      - ./configs/r1/bird.conf:/etc/bird/bird.conf:ro
    networks:
      net_r1_r2:
        ipv4_address: 10.12.0.10
      net_r1_r5:
        ipv4_address: 10.15.0.10

  r2:
    image: router-bird
    container_name: r2
    hostname: r2
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
    volumes:
      - ./configs/r2/bird.conf:/etc/bird/bird.conf:ro
    networks:
      net_r1_r2:
        ipv4_address: 10.12.0.20
      net_r2_r3:
        ipv4_address: 10.23.0.20
      net_r2_r4:
        ipv4_address: 10.24.0.20

  r3:
    image: router-bird
    container_name: r3
    hostname: r3
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
    volumes:
      - ./configs/r3/bird.conf:/etc/bird/bird.conf:ro
    networks:
      net_r2_r3:
        ipv4_address: 10.23.0.30
      net_r3_r5:
        ipv4_address: 10.35.0.30

  r4:
    image: router-bird
    container_name: r4
    hostname: r4
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
    volumes:
      - ./configs/r4/bird.conf:/etc/bird/bird.conf:ro
    networks:
      net_r2_r4:
        ipv4_address: 10.24.0.40

  r5:
    image: router-bird
    container_name: r5
    hostname: r5
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
    volumes:
      - ./configs/r5/bird.conf:/etc/bird/bird.conf:ro
    networks:
      net_r1_r5:
        ipv4_address: 10.15.0.50
      net_r3_r5:
        ipv4_address: 10.35.0.50

networks:
  net_r1_r2:
    ipam:
      config:
        - subnet: 10.12.0.0/24
  net_r1_r5:
    ipam:
      config:
        - subnet: 10.15.0.0/24
  net_r2_r3:
    ipam:
      config:
        - subnet: 10.23.0.0/24
  net_r2_r4:
    ipam:
      config:
        - subnet: 10.24.0.0/24
  net_r3_r5:
    ipam:
      config:
        - subnet: 10.35.0.0/24
