log stderr all;
router id 3.3.3.3;
protocol device {}
protocol direct { ipv4; }
protocol kernel { ipv4 { export all; }; }
protocol ospf v2 ospf1 {
    ipv4 { import all; export all; };
    area 0 {
        interface "eth0" { cost 10; type broadcast; };
        interface "eth1" { cost 10; type broadcast; };
    };
}
